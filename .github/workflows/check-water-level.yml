name: Check Water Level (Kasetsomboon)

on:
  schedule:
    - cron: '7,27,47 * * * *'   # ทุก 20 นาที (นาทีที่ 7, 27, 47 ของทุกชั่วโมง)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: water-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run water level check
        run: node scripts/check-water-level.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

      - name: Commit updated state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'update water alert state'
          file_pattern: 'state.json'
